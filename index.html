<style>
:root{--g:#06C755;--lg:#D7F5E3;--grey:#999;--tip:#C25E00;--tipbg:#FFF1DE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#F2F4F3;color:#111;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{background:var(--g);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:34px;height:34px;border-radius:50%;background:#fff}
header h1{font-size:19px;margin:0;font-weight:800}
header small{display:block;font-size:11px;opacity:.9;font-weight:400}
main{padding:12px;max-width:520px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e3e3;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:#777;font-family:inherit}
nav button b{display:block;font-size:20px;line-height:24px}
nav button.on{color:var(--g);font-weight:700}
.panel{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.step{font-size:13px;color:var(--grey);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--g);color:var(--g);background:#fff;border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;font-family:inherit}
.chip.on{background:var(--g);color:#fff}
.sortc{margin:-4px 0 12px;align-items:center}.sortc span{font-size:13px;color:#666}.sortc .chip{padding:5px 11px;font-size:13px}
.bagl{font-size:14px;font-weight:700;color:#333;margin:2px 0}.bagl.inc{color:#047A35}.bagnote{font-size:12px;color:#777;margin:-6px 0 10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.cal-head b{font-size:16px}
.cal-head button{border:0;background:var(--lg);color:#047a35;border-radius:12px;padding:5px 12px;font-size:13px;font-weight:700}
.cal-head button:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid .w{font-size:12px;color:var(--grey);padding:3px 0}
.grid .d{height:38px;line-height:38px;border-radius:10px;font-size:15px;border:0;background:none;font-family:inherit;color:#111;padding:0}
.grid .d:disabled{color:#ccc}
.grid .d.in{background:var(--lg)}
.grid .d.end{background:var(--g);color:#fff;font-weight:800}
.sel{font-size:14px;margin:10px 0 0;color:#333}
.btn{display:block;width:100%;border:0;background:var(--g);color:#fff;font-size:16px;font-weight:800;border-radius:24px;padding:12px;margin-top:12px;font-family:inherit}
.btn:disabled{background:#bfe9cf}
.summary{font-size:13px;color:#444;margin:4px 2px 10px;white-space:pre-line}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card .grp{font-size:11px;color:var(--grey)}
.card .dest{font-size:19px;font-weight:800;margin:2px 0}
.card .org{font-size:12px;color:var(--grey)}
.card .price{font-size:28px;font-weight:800;color:var(--g);margin:2px 0}
.card .price small{font-size:15px}
.card .taxl{font-size:11px;color:#888;margin:-2px 0 2px}
.card .lhb{display:inline-block;background:var(--g);color:#fff;font-size:12px;font-weight:800;border-radius:10px;padding:2px 9px;margin:4px 0 2px}
.card .lhs{font-size:14px;font-weight:800;color:#333;margin:4px 0 2px}
.card .lhw{font-size:13px;font-weight:700;color:#E67E22;margin-top:3px}
.card .info{font-size:14px;color:#666}
.card .tip{background:var(--tipbg);color:var(--tip);font-size:12px;font-weight:700;border-radius:10px;padding:6px 8px;margin-top:6px}
.card .meta{font-size:11px;color:var(--grey);margin-top:6px;line-height:1.6}
.card .meta .alt{color:#555}
.flform input,.flform select{padding:8px;border:1px solid #ccc;border-radius:8px;margin:3px 0;font-size:15px}
.hint{color:#E65100;font-weight:600}
.card .meta .seller{color:#E65100;font-weight:700;font-size:13px}
.card .opt{border-top:1px solid #eee;margin-top:8px;padding-top:8px;font-size:13px}
.card .opt .r{display:flex;justify-content:space-between;font-weight:700}
.card .opt .r span:last-child{color:var(--g)}
.links{display:flex;gap:8px;margin-top:10px}
.links a{flex:1;text-align:center;border:2px solid var(--g);color:var(--g);border-radius:20px;padding:8px 0;font-size:14px;font-weight:800;text-decoration:none}
.links.small a{font-size:12px;padding:4px 0;border-width:1.5px}
.empty{text-align:center;color:#777;font-size:14px;padding:24px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
.toast.on{opacity:.95}
.help h3{font-size:16px;margin:4px 0 6px}
.help p,.help li{font-size:14px;line-height:1.7;color:#333}
.qopen{border:0;background:none;padding:0;text-align:left;width:100%;font-family:inherit;color:inherit}
.links a.pill{cursor:pointer}
.links a.del{border-color:#E6B0AA;color:#C0392B}
.yt{display:block;position:relative;width:min(100%,300px);margin:0 auto;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000}
.yt iframe,.yt img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.yt .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,0,0,.9);color:#fff;font-size:28px;line-height:64px;text-align:center;padding-left:4px;box-sizing:border-box}
footer{text-align:center;font-size:12px;color:#777;line-height:1.9;padding:10px 0 4px}
footer a{color:#047a35;text-decoration:none;font-weight:700;cursor:pointer}
footer .copy{color:#aaa;font-size:11px}
.sponsor{display:inline-block;font-weight:700;text-decoration:none;margin:0 0 6px;border:2px solid var(--g);border-radius:18px;padding:5px 14px;color:var(--g)}
.back{border:0;background:none;color:var(--g);font-weight:800;font-size:14px;padding:4px 0 10px;font-family:inherit}

/* ---------- v16 動畫 ---------- */
#splash{position:fixed;inset:0;z-index:50;background:var(--g);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:spPop .6s cubic-bezier(.3,1.6,.5,1) both}
#splash .lg img{width:96px;height:96px;border-radius:50%}
#splash b{font-size:24px;font-weight:800;margin-top:14px;animation:spUp .5s .15s ease-out both}
#splash small{font-size:13px;opacity:.9;margin-top:4px;animation:spUp .5s .25s ease-out both}
@keyframes spPop{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
button,.links a,.sponsor{transition:transform .15s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s}
button:active:not(:disabled),.links a:active,.sponsor:active{transform:scale(.94)}
.btn.press{animation:bounce .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(.92)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
nav button b{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button.on b{transform:translateY(-2px) scale(1.12)}
main.inR{animation:inR .28s ease-out both}main.inL{animation:inL .28s ease-out both}main.inF{animation:inF .22s ease-out both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.fl{animation:flIn .45s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes flIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.chip.on{animation:chipOn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes chipOn{0%{transform:scale(.9)}100%{transform:scale(1)}}
.loader{text-align:center;padding:14px 10px 6px}
.loader svg{display:block;margin:0 auto;width:240px;max-width:100%;height:70px;overflow:visible}
.loader .path{stroke:#9BDDB6;stroke-width:2;stroke-dasharray:6 6;fill:none;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.loader .plane{offset-path:path('M10,55 C70,0 170,0 230,40');offset-rotate:auto;animation:fly 1.8s ease-in-out infinite;transform-box:fill-box}
@keyframes fly{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.loader .mag{display:inline-block;font-size:22px;animation:wob 1.2s ease-in-out infinite;transform-origin:60% 60%}
@keyframes wob{0%,100%{transform:rotate(-12deg) translateX(-2px)}50%{transform:rotate(12deg) translateX(2px)}}
.loader p{margin:4px 0 0;font-size:14px;color:#555;font-weight:700}
.sk{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.sk i{display:block;height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,#eceeed 25%,#f7f8f8 45%,#eceeed 65%);background-size:300% 100%;animation:shim 1.2s linear infinite}
.sk i.t{width:40%;height:18px}.sk i.p{width:55%;height:26px}.sk i.s{width:80%}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
 .loader .plane{offset-distance:50%;opacity:1}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="lg" id="splogo">✈️</div><b>飛省 FlySave</b><small>來回直飛便宜機票</small></div>
<header><img id="logo" alt=""><h1>飛省 FlySave<small id="upd">來回直飛便宜機票</small></h1></header>
<main id="main"></main>
<nav>
 <button data-tab="search" class="on"><b>🔎</b>查機票</button>
 <button data-tab="mine"><b>📋</b>我的查詢</button>
 <button data-tab="promos"><b>🔥</b>最新優惠</button>
 <button data-tab="help"><b>💡</b>說明</button>
</nav>
<div class="toast" id="toast"></div>
<script>
var BOOT = null;
var API = "https://script.google.com/macros/s/AKfycbwfUys8iT8UTMEENbHRGUkjESwkYHeM-5SEuDL_WizwPYtm-CdPJ-BQaDKK-8i9yMhh0g/exec";
var LOGO = "icon-96.png";
var REGION_ORDER = ['日本','韓國','東南亞','香港','澳門','中國大陸','其他'];
var LEGACY_REGION = {'港澳':['香港','澳門']};   // 舊資料／舊查詢的「港澳」= 香港＋澳門
function regOf(x){return x.region==='港澳'?(String(x.code).toUpperCase()==='MFM'||/澳門/.test(x.dest||'')?'澳門':'香港'):x.region;}
var REGION_ICON = {'日本':'🇯🇵','韓國':'🇰🇷','東南亞':'🌴','香港':'🇭🇰','澳門':'🇲🇴','港澳':'🏙️','中國大陸':'🇨🇳','其他':'🌏','遠程':'🌍'};
var COUNTRY_ORDER = ['泰國','越南','菲律賓','馬來西亞','新加坡','印尼','柬埔寨','緬甸','寮國','汶萊','東帝汶'];
var COUNTRY_ICON = {'泰國':'🇹🇭','越南':'🇻🇳','菲律賓':'🇵🇭','馬來西亞':'🇲🇾','新加坡':'🇸🇬','印尼':'🇮🇩','柬埔寨':'🇰🇭','緬甸':'🇲🇲','寮國':'🇱🇦','汶萊':'🇧🇳','東帝汶':'🇹🇱'};
var MODE = {cp:'🏆 CP值最高',exact:'📅 只查指定日期',nodate:'💰 不指定日期'};
var ORIGIN = {TPE:'台北',KHH:'高雄',ALL:'台北＋高雄'};
var SRC = {google:'Google',trip:'Trip.com'};
var STALE = 12*3600e3;
var D = BOOT, tab = 'search';
var st = {step:'mode', mode:null, dep:null, ret:null, month:null, origin:null, region:null, country:null, lhSub:null};
var LH_SUBS=['北美','歐洲','大洋洲','中東/南亞'], LH_ICON={'北美':'🌎','歐洲':'🇪🇺','大洋洲':'🦘','中東/南亞':'🕌'}, LH_MS=26*3600e3;
var LHK='connect';try{if(localStorage.getItem('tb_lhk')==='nonstop')LHK='nonstop';}catch(e){}
try { var sv = JSON.parse(localStorage.getItem('tb_st')||'{}'); if (sv.origin) st.origin = sv.origin; } catch(e){}

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function tw(){return new Date(Date.now()+8*3600e3);}
function iso(t){return t.toISOString().slice(0,10);}
function today(){return iso(tw());}
function addDays(s,n){var t=new Date(s+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return iso(t);}
function md(s){var a=s.split('-');return (+a[1])+'/'+(+a[2]);}
function days(a,b){return Math.round((new Date(b)-new Date(a))/864e5)+1;}
function okUrl(u){return typeof u==='string'&&/^https:\/\/\S+$/.test(u);}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on');},2600);}
function fresh(x){if(!x.checkedAt)return true;var t=Date.parse(x.checkedAt);return isNaN(t)||Date.now()-t<=STALE;}
function checked(x){
  var t=x.checkedAt?new Date(Date.parse(x.checkedAt)+8*3600e3):null, w='';
  if(t&&!isNaN(t))w=(t.getUTCMonth()+1)+'/'+t.getUTCDate()+' '+('0'+t.getUTCHours()).slice(-2)+':'+('0'+t.getUTCMinutes()).slice(-2)+' 查詢';
  return [SRC[x.source]||'',w].filter(Boolean).join('・');
}

/* ---------- 資料 ---------- */
function load(cb){
  LOADING=true; var done=cb; cb=function(){LOADING=false;done&&done();};
  if(tab==='search'&&st.step==='result')render();
  var fail=function(m){LOADING=false;toast(m);render();};
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function(d){D=d;cb&&cb();}).withFailureHandler(function(){fail('讀取失敗，請稍後再試');}).webGetDeals();
  } else if (API) {
    fetch(API+(API.indexOf('?')<0?'?':'&')+'action=deals').then(function(r){return r.json();}).then(function(d){D=d;cb&&cb();}).catch(function(){fail('讀取失敗，請檢查網路');});
  } else cb();
}
function post(fn,args,body,cb){            // google.script.run（Apps Script 頁面）或 POST（App／靜態網站）
  if (window.google && google.script && google.script.run) { var r=google.script.run.withSuccessHandler(cb).withFailureHandler(function(){cb(null);}); r[fn].apply(r,args); }
  else if (API) fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}).then(function(x){return x.json();}).then(cb).catch(function(){cb(null);});
  else cb({ok:true,dates:[]});
}
function setDates(r){if(r&&r.dates&&D)D.dates=r.dates;}
function delDate(x){post('webDeleteDate',[x.from,x.to,x.mode],{action:'webDeleteDate',from:x.from,to:x.to,mode:x.mode},function(r){setDates(r);toast(r&&r.ok?'🗑️ 已刪除 '+md(x.from)+'–'+md(x.to):(r&&r.error)||'刪除失敗');render();});}
function clearDates(){post('webClearDates',[],{action:'webClearDates'},function(r){setDates(r);toast(r&&r.ok?'🗑️ 已清除所有日期':'清除失敗');render();});}
function saveDate(from,to,mode,cb){
  var done=function(r){setDates(r);if(r&&r.ok)toast('✅ 已存 '+md(from)+'–'+md(to)+'，下一次查詢（07:00／15:00／23:00）後就會有結果'+(r.note?'\n'+r.note:''));else toast((r&&r.error)||'存檔失敗');cb&&cb(r);};
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(done).withFailureHandler(function(){done(null);}).webSaveDate(from,to,mode);
  else if (API) fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'webSaveDate',from:from,to:to,mode:mode})}).then(function(r){return r.json();}).then(done).catch(function(){done(null);});
  else done({ok:true});
}
function all(k){return ((D&&D[k])||[]).filter(fresh);}
function okItem(x){return (st.origin==='ALL'||x.origin===st.origin)&&(st.region==='全部'||regOf(x)===st.region||(LEGACY_REGION[st.region]||[]).indexOf(regOf(x))>=0)&&(st.region!=='東南亞'||!st.country||st.country==='全部'||x.country===st.country);}
var SORT_BAG=false;try{SORT_BAG=localStorage.getItem('tb_sort')==='bag';}catch(e){}
function kp(x){return SORT_BAG&&x.priceWithBag?+x.priceWithBag:+x.price;}
function merge(items){var m={};items.forEach(function(x){var k=x.origin+x.code;if(!m[k]||kp(x)<kp(m[k]))m[k]=x;});return Object.keys(m).map(function(k){return m[k];});}
function sortKey(x){return kp(x)+(x.score!=null&&x.score!==''?+x.score-x.price:0);}
function bagLine(x){if(x.bagIncluded===true)return '🧳 已含行李'+(x.bagKg?'（'+x.bagKg+'kg）':'');if(x.bagIncluded===false&&x.priceWithBag)return '🧳 含 '+(x.bagKg||20)+'kg 行李 約 NT$'+num(x.priceWithBag);return '';}
function regions(){return ['日本','韓國','東南亞','香港','澳門','中國大陸','遠程'];}
function countries(){var s={};all('short').concat(all('long'),all('custom')).forEach(function(x){if(x.region==='東南亞')s[x.country]=1;});return COUNTRY_ORDER.filter(function(c,i){return i<7||s[c];});}

/* ---------- 畫面 ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab);});
  $('upd').textContent = D&&D.updatedAt ? '票價 '+D.updatedAt+' 查詢・來回直飛' : '來回直飛便宜機票';
  var h = tab==='about'?about():tab==='privacy'?privacy():tab==='terms'?terms():tab==='mine'?mine():tab==='promos'?promos():tab==='help'?help():search();
  var html=h+footer(), m=$('main');
  if(html===LAST_HTML)return; var changed=LAST_TAB!==null, tabChg=LAST_TAB!==tab, stepChg=LAST_STEP!==st.step, sameView=!tabChg&&!stepChg;
  m.innerHTML=html; LAST_HTML=html;
  if(!sameView) window.scrollTo(0,0);
  if(changed&&!sameView){var ti=TABS.indexOf(tab),pi=TABS.indexOf(LAST_TAB);m.classList.remove('inR','inL','inF');void m.offsetWidth;m.classList.add(tabChg&&ti>=0&&pi>=0?(ti>pi?'inR':'inL'):'inF');}
  var fx=!sameView||LAST_SIG!==sig();
  if(fx) animCards(m);
  LAST_TAB=tab; LAST_STEP=st.step; LAST_SIG=sig();
}
var LAST_HTML=null, LAST_TAB=null, LAST_STEP=null, LAST_SIG=null, LOADING=false, TABS=['search','mine','promos','help'];
function sig(){return [tab,st.step,st.mode,st.dep,st.ret,st.origin,st.region,st.country,SORT_BAG,!!D,LOADING].join('|');}
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function animCards(m){
  var cs=m.querySelectorAll('.card'); cs.forEach(function(c,i){c.style.setProperty('--i',Math.min(i,8));c.classList.add('fl');});
  if(RM)return;

var BACK={cal:'mode',origin:'cal',region:'origin',country:'region',lhsub:'region',result:'region'};
document.addEventListener('click',function(e){
  var b=e.target.closest('nav button'); if(b){tab=b.dataset.tab;render();return;}
  var a=e.target.closest('[data-act]'); if(!a||a.disabled)return;
  var v=a.dataset.act, k=v.split(':')[0], x=v.slice(k.length+1);
  var ds=((D&&D.dates)||[]).filter(function(q){return q.to>=today();});
  if(k==='tab'){tab=x;render();return;}
  if(k==='sort'){SORT_BAG=x==='bag';try{localStorage.setItem('tb_sort',x);}catch(err){}render();return;}
  if(k==='open'){var q=ds[+x];if(!q)return;tab='search';st.mode=q.mode;st.dep=q.from;st.ret=q.to;st.origin=st.origin||'ALL';st.region='全部';st.country=null;st.step='result';render();load(render);return;}
  if(k==='del'){var q2=ds[+x];if(q2&&confirm('刪除 '+md(q2.from)+'–'+md(q2.to)+' '+MODE[q2.mode]+'？'))delDate(q2);return;}
  if(k==='clear'){if(confirm('清除所有存起來的日期？'))clearDates();return;}
  if(k==='m'){st.mode=x;st.step=x==='nodate'?'origin':'cal';if(x==='nodate'){st.dep=st.ret=null;}}
  else if(k==='cm')st.month=x;
  else if(k==='cd'){if(!st.dep||st.ret||x<=st.dep){st.dep=x;st.ret=null;}else st.ret=x;st.month=x.slice(0,7);}
  else if(k==='calok'){st.step='origin';saveDate(st.dep,st.ret,st.mode);}
  else if(k==='o'){st.origin=x;st.step='region';try{localStorage.setItem('tb_st',JSON.stringify({origin:x}));}catch(err){}}
  else if(k==='r'){st.region=x;st.country=null;st.lhSub=null;st.step=x==='東南亞'?'country':x==='遠程'?'lhsub':'result';}
  else if(k==='ls'){st.lhSub=x;st.step='result';}
  else if(k==='lk'){LHK=x==='nonstop'?'nonstop':'connect';try{localStorage.setItem('tb_lhk',LHK);}catch(err){}}
  else if(k==='c'){st.country=x;st.step='result';}
  else if(k==='back'){st.step=st.step==='result'&&st.region==='東南亞'?'country':st.step==='result'&&st.region==='遠程'?'lhsub':BACK[st.step]||'mode';if(st.step==='cal'&&st.mode==='nodate')st.step='mode';}
  else if(k==='again'){st.step=x;if(x==='mode'){st.mode=null;st.dep=st.ret=null;}}
  render();
  if(st.step==='result')load(render);
});
