<style>

@media (max-width:360px){header{gap:6px;padding-left:12px;padding-right:12px}header img{width:28px;height:28px}header h1{font-size:16px}}

/* ---------- v22 介面 ---------- */
.mopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid #e3e3e3;background:#fff;border-radius:14px;padding:12px 14px;margin:0 0 10px;font-family:inherit;color:inherit}

.note{font-size:12px;color:#888;margin:-4px 2px 12px}

/* ---------- v16 動畫 ---------- */
#splash{position:fixed;inset:0;z-index:50;background:var(--g);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .lg{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:spPop .6s cubic-bezier(.3,1.6,.5,1) both}
#splash .lg img{width:96px;height:96px;border-radius:50%}
#splash b{font-size:24px;font-weight:800;margin-top:14px;animation:spUp .5s .15s ease-out both}
#splash small{font-size:13px;opacity:.9;margin-top:4px;animation:spUp .5s .25s ease-out both}
@keyframes spPop{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
button,.links a,.sponsor{transition:transform .15s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s}
button:active:not(:disabled),.links a:active,.sponsor:active{transform:scale(.94)}
.btn.press{animation:bounce .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(.92)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
nav button b{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button.on b{transform:translateY(-2px) scale(1.12)}
main.inR{animation:inR .28s ease-out both}main.inL{animation:inL .28s ease-out both}main.inF{animation:inF .22s ease-out both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.fl{animation:flIn .45s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes flIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.chip.on{animation:chipOn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes chipOn{0%{transform:scale(.9)}100%{transform:scale(1)}}
.loader{text-align:center;padding:14px 10px 6px}
.loader svg{display:block;margin:0 auto;width:240px;max-width:100%;height:70px;overflow:visible}
.loader .path{stroke:#9BDDB6;stroke-width:2;stroke-dasharray:6 6;fill:none;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.loader .plane{offset-path:path('M10,55 C70,0 170,0 230,40');offset-rotate:auto;animation:fly 1.8s ease-in-out infinite;transform-box:fill-box}
@keyframes fly{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.loader .mag{display:inline-block;font-size:22px;animation:wob 1.2s ease-in-out infinite;transform-origin:60% 60%}
@keyframes wob{0%,100%{transform:rotate(-12deg) translateX(-2px)}50%{transform:rotate(12deg) translateX(2px)}}
.loader p{margin:4px 0 0;font-size:14px;color:#555;font-weight:700}
.sk{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.sk i{display:block;height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,#eceeed 25%,#f7f8f8 45%,#eceeed 65%);background-size:300% 100%;animation:shim 1.2s linear infinite}
.sk i.t{width:40%;height:18px}.sk i.p{width:55%;height:26px}.sk i.s{width:80%}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
 .loader .plane{offset-distance:50%;opacity:1}
}
/* ---------- v23 底部列（參考國考神器） ---------- */
nav{background:#fffffff2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid #e3e8ee;padding:4px env(safe-area-inset-right) calc(4px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}

<script>
